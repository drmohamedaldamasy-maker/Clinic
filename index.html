<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دكتور محمد الدماصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0d3b2c;--green2:#16573f;--gold:#d9a92b;--ivory:#f6f1e3;--ink:#0a2a1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ivory);
background:radial-gradient(120% 80% at 50% 0%,var(--green2) 0%,var(--green) 55%,#082a1f 100%) fixed;
display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:40px 22px 36px;text-align:center}
.photo{width:210px;height:250px;margin:0 auto 16px;border-radius:105px 105px 22px 22px;border:3px solid var(--gold);overflow:hidden;background:#fff}.photo img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.eye{width:84px;height:84px;margin:0 auto 14px;display:block}
h1{margin:0;font-size:2rem;font-weight:800;line-height:1.3}
.role{margin:6px 0 0;font-size:1.05rem;font-weight:600;line-height:1.6;color:var(--ivory)}
.sub{margin:8px 0 0;color:var(--gold);font-weight:600;font-size:1.05rem}
.rule{width:64px;height:2px;background:var(--gold);margin:22px auto 26px;opacity:.8}
.links{display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;gap:14px;padding:20px 20px;border-radius:16px;text-decoration:none;color:var(--ivory);
background:rgba(246,241,227,.07);border:1px solid rgba(217,169,43,.55);text-align:start;transition:background .2s}
.btn:hover{background:rgba(217,169,43,.18)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ic{flex:0 0 44px;height:44px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center}
.ic svg{width:24px;height:24px}
a[href*="google.com"] .ic{background:#fff;color:#fbbc04}
a[href*="facebook.com"] .ic{background:#1877f2;color:#fff}
a[href*="instagram.com"] .ic{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%);color:#fff}
a[href*="ipn.eg"] .ic{background:#6f2da8;color:#fff}
a[href*="wa.me"] .ic{background:#25d366;color:#fff}
.t{display:flex;flex-direction:column;line-height:1.35;flex:1;text-align:center}
.t b{font-size:1.45rem;font-weight:800}
.t small{font-size:.85rem;opacity:.8;direction:ltr;text-align:start}
.pay{margin-top:18px;font-size:.9rem;opacity:.85}
.pay button{font:inherit;color:var(--ink);background:var(--ivory);border:0;border-radius:999px;padding:6px 14px;margin-top:8px;cursor:pointer;font-weight:600}
.pay button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pay code{display:block;direction:ltr;margin-top:6px;color:var(--gold);word-break:break-all}
</style>
</head>
